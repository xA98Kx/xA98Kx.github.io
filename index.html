<!DOCTYPE html>
<style>
    .text{
        font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        text-align: center;
        align-self: top;
        font-size: 64px;
        color: aliceblue;
    }
    .idk{
        
        text-align: center;
        margin-top: 250px;
    }
    .yt{
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        font-size: large;
        border: none;
        padding: 10px;
        border-radius: 10px;
        background-color: #62629b;
        color: aliceblue;
        text-decoration: none;
        display: inline-block;
    }
    .yt:hover{
        cursor: pointer;
        opacity: 0.8;
    }
    .but{
        text-align: center;
        display: flex;
        justify-content: center;
        gap: 12px;
    }
    body{
        background : linear-gradient(to bottom, #11111b, #564c81);
        background-repeat: no-repeat;
        background-attachment: fixed;
    }

    /* ---- cat + shine on the keeb tester button (loops every 60s) ---- */
    .kwrap{
        position: relative;
        display: inline-block;
    }
    .peek{
        position: absolute;
        bottom: 100%;
        left: 50%;
        margin-left: -32px;
        width: 64px;
        height: 40px;
        overflow: hidden;          /* the button's top edge hides the cat */
        pointer-events: none;
    }
    .cat{
        display: block;
        width: 64px;
        height: 40px;
        transform: translateY(105%);
        animation: peek 60s ease-out 3s infinite;
    }
    .pupils{
        animation: look 60s ease-in-out 3s infinite;
    }
    .shiny{
        position: relative;
        overflow: hidden;
    }
    .shiny::after{                 /* the anime sheen: one wide band + one thin band */
        content: "";
        position: absolute;
        top: -10%;
        left: -70%;
        width: 55%;
        height: 120%;
        pointer-events: none;
        background: linear-gradient(105deg,
            transparent 0 28%,
            rgba(255,255,255,.7) 28% 58%,
            transparent 58% 66%,
            rgba(255,255,255,.55) 66% 76%,
            transparent 76%);
        animation: sheen 60s ease-in-out 3s infinite;
    }
    .shiny::before{                /* little sparkle in the corner */
        content: "\2726";
        position: absolute;
        top: 1px;
        right: 7px;
        font-size: 13px;
        color: #fff;
        opacity: 0;
        pointer-events: none;
        animation: twinkle 60s ease-out 3s infinite;
    }
    /* 1% of 60s = 0.6s. Cat is out for roughly 5 seconds, once a minute. */
    @keyframes peek{
        0%   { transform: translateY(105%); }
        1.5% { transform: translateY(-4%); }
        2%   { transform: translateY(0); }
        7.5% { transform: translateY(0); }
        9%   { transform: translateY(105%); }
        100% { transform: translateY(105%); }
    }
    @keyframes look{
        0%, 3%   { transform: translate(0, 0); }
        4%, 7.5% { transform: translate(0, 2px); }
        9%, 100% { transform: translate(0, 0); }
    }
    @keyframes sheen{
        0%, 4.5% { left: -70%; }
        6.5%     { left: 130%; }
        100%     { left: 130%; }
    }
    @keyframes twinkle{
        0%, 5.4%, 7.4%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
        6.2%                 { opacity: 1; transform: scale(1.3) rotate(25deg); }
    }
    @media (prefers-reduced-motion: reduce){
        .cat, .pupils, .shiny::after, .shiny::before{ animation: none; }
    }
</style>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>
</head>
<body bgcolor="#11111b">
    <p class="idk"><span class="text">Website under development</span></p>
    <p class="but">
        <button class="yt">Funny button?</button>
        <span class="kwrap">
            <span class="peek">
                <svg class="cat" viewBox="0 0 64 40" aria-hidden="true">
                    <path d="M10 24L12 3L27 14Z" fill="#fab387" stroke="#3b2f4a" stroke-width="1.5" stroke-linejoin="round"/>
                    <path d="M54 24L52 3L37 14Z" fill="#fab387" stroke="#3b2f4a" stroke-width="1.5" stroke-linejoin="round"/>
                    <path d="M14 18L14.5 8L22 14Z" fill="#f5a0b5"/>
                    <path d="M50 18L49.5 8L42 14Z" fill="#f5a0b5"/>
                    <ellipse cx="32" cy="27" rx="22" ry="15" fill="#fab387" stroke="#3b2f4a" stroke-width="1.5"/>
                    <path d="M32 13v5M27 14l1 4M37 14l-1 4" stroke="#e08b5a" stroke-width="1.5" stroke-linecap="round"/>
                    <ellipse cx="14" cy="31" rx="4" ry="2.5" fill="#f5a0b5" opacity=".55"/>
                    <ellipse cx="50" cy="31" rx="4" ry="2.5" fill="#f5a0b5" opacity=".55"/>
                    <circle cx="23" cy="26" r="5.5" fill="#fff"/>
                    <circle cx="41" cy="26" r="5.5" fill="#fff"/>
                    <g class="pupils">
                        <circle cx="23" cy="26" r="3.2" fill="#11111b"/>
                        <circle cx="41" cy="26" r="3.2" fill="#11111b"/>
                        <circle cx="24.2" cy="24.6" r="1.1" fill="#fff"/>
                        <circle cx="42.2" cy="24.6" r="1.1" fill="#fff"/>
                    </g>
                    <path d="M30 31h4l-2 2.4Z" fill="#f5a0b5"/>
                    <path d="M32 33.4q-1 3-4 2.2M32 33.4q1 3 4 2.2" fill="none" stroke="#3b2f4a" stroke-width="1.2" stroke-linecap="round"/>
                    <path d="M8 29l-7-1.5M8 32l-7 1.5M56 29l7-1.5M56 32l7 1.5" stroke="#3b2f4a" stroke-width="1" stroke-linecap="round" opacity=".6"/>
                    <ellipse cx="19" cy="38" rx="7" ry="4" fill="#fab387" stroke="#3b2f4a" stroke-width="1.5"/>
                    <ellipse cx="45" cy="38" rx="7" ry="4" fill="#fab387" stroke="#3b2f4a" stroke-width="1.5"/>
                    <path d="M17 36.5v2.5M21 36.5v2.5M43 36.5v2.5M47 36.5v2.5" stroke="#3b2f4a" stroke-width="1" stroke-linecap="round"/>
                </svg>
            </span>
            <a class="yt shiny" href="keeb">Keeb tester</a>
        </span>
    </p>
</body>
</html>
